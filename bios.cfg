MEMORY {
	ZP:	start = $0000, size = $0100, type = rw;
	RAM: start = $0000, size = $8000, type = rw;
	BASEROM: start = $C000, size = 3E00, fill = yes, file - %0;
	WOZMON: start = $FE00, size = $1FA, fill = yes, file - %0;
	RESETVEC: start = $FFFA, size = $6, fill = yes, file - %0;
}
SEGMENTS {
	ZEROPAGE: load = ZP, type = zp;
	HEADER:	load = BASEROM, type =ro;
	VECTORS: load = BASEROM, type = ro;
	KEYWORDS: load = BASEROM, type = ro;
	ERROR: load = BASEROM, type = ro;
	BIOS: load = BASEROM, type = ro;
	CODE: load = BASEROM, type = ro;
	WOZMON: load = WOZMON, type = ro;
	RESETVEC: load = RESETVEC, type = ro;
}